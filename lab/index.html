<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cloud · 动态云实验</title>
  </head>
  <body>
    <canvas id="sky" aria-label="实时生成的天空"></canvas>
    <header>
      <a class="brand" href="../">cloud<span>.</span></a
      ><span class="tag">动态云实验</span>
    </header>
    <main>
      <section class="intro">
        <span class="eyebrow">A SKY IN MOTION</span>
        <h1>看云，慢慢变化。</h1>
        <p id="description">有厚度的云，随风移动，也慢慢舒展。</p>
      </section>
      <aside class="panel" aria-label="天空控制">
        <div class="modes" role="group" aria-label="云的形态">
          <button data-mode="volume" aria-pressed="true">体积云</button>
          <button data-mode="cirrus" aria-pressed="false">卷云</button>
          <button data-mode="cirrocumulus" aria-pressed="false">卷积云</button>
        </div>
        <label
          >风速 <output id="wind-value">1.0×</output
          ><input id="wind" type="range" min="0" max="5" step="0.1" value="1"
        /></label>
        <label
          >演化速度 <output id="evolution-value">1.0×</output
          ><input id="evolution" type="range" min="0" max="4" step="0.1" value="1"
        /></label>
        <label
          >云量 <output id="coverage-value">32%</output
          ><input id="coverage" type="range" min="0.1" max="0.9" step="0.01" value="0.32"
        /></label>
        <label
          >仰角 <output id="pitch-value">28°</output
          ><input id="pitch" type="range" min="8" max="80" step="1" value="28"
        /></label>
        <div class="row">
          <label for="speed">时间流速</label
          ><select id="speed">
            <option value="1">自然 · 1×</option>
            <option value="10">延时 · 10×</option>
            <option value="30">延时 · 30×</option>
          </select>
        </div>
        <div class="row">
          <label for="quality">画质</label
          ><select id="quality">
            <option value="medium">均衡</option>
            <option value="high">精细</option>
            <option value="low">流畅</option>
          </select>
        </div>
        <div class="actions">
          <button id="pause" aria-pressed="false" disabled>暂停</button
          ><button id="advance" disabled>前进 30 秒</button
          ><button id="reset" disabled>重置</button>
        </div>
        <p class="hint">将风速设为 0，观察原地演化；将演化设为 0，观察随风移动。</p>
        <output id="status" role="status">正在准备天空…</output>
        <button id="retry" hidden>重新加载</button>
      </aside>
    </main>
    <footer>
      <span id="source">Takram · 体积云与大气散射</span
      ><a href="../reference/" target="_blank" rel="noreferrer">算法来源 ↗</a>
    </footer>
    <script type="module" src="../src/lab/main.ts"></script>
  </body>
</html>
